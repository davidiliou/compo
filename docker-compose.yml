services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compo
      POSTGRES_PASSWORD: compo
      POSTGRES_DB: compo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compo -d compo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://compo:compo@db:5432/compo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3080:80"
    depends_on:
      - backend

volumes:
  pgdata:
