services:
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: compo
      POSTGRES_PASSWORD: compo
      POSTGRES_DB: compo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compo -d compo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      # Par défaut : Neon via .env. Postgres locale : profile local-db + URL locale.
      DATABASE_URL: ${DATABASE_URL:-postgresql://compo:compo@db:5432/compo}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3080:80"
    depends_on:
      - backend

volumes:
  pgdata:
