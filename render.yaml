# Render Blueprint — API Docker + site static (gratuit)
# Base de données : Neon (gratuit) — définir DATABASE_URL manuellement
# dans le dashboard Render (Environment), pas via une Postgres Render.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: compo-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # À renseigner dans Render → compo-api → Environment :
      # postgresql://USER:PASSWORD@HOST/DB?sslmode=require
      - key: DATABASE_URL
        sync: false

  # Les static sites sont toujours gratuits : pas de champ "plan"
  - type: web
    name: compo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://compo-api.onrender.com/api
