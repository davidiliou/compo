# Render Blueprint — free web + free Postgres + free static site
# https://render.com/docs/blueprint-spec
databases:
  - name: compo-db
    plan: free

services:
  - type: web
    name: compo-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: compo-db
          property: connectionString

  # Les static sites sont toujours gratuits : pas de champ "plan"
  - type: web
    name: compo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://compo-api.onrender.com/api
