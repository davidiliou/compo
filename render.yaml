# Render Blueprint — https://render.com/docs/blueprint-spec
databases:
  - name: compo-db
    plan: basic-256mb

services:
  - type: web
    name: compo-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: compo-db
          property: connectionString

  - type: web
    name: compo-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Doit correspondre au nom du service API ci-dessus
      - key: VITE_API_URL
        value: https://compo-api.onrender.com/api
