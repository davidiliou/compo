# Render Blueprint — 100% free (pas de base Render payante)
# Doc : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: compo-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # SQLite gratuit (fichier local). Les données peuvent être perdues
      # quand le service free redémarre / se réveille.
      - key: DATABASE_URL
        value: sqlite:///./compo.db

  - type: web
    name: compo-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://compo-api.onrender.com/api
